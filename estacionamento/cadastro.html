<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Reserva</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h2>Cadastro de Reserva</h2>
    <form id="formReserva" class="formulario">
      <input type="text" placeholder="Placa do Veículo" id="placa" required />
      <input type="text" placeholder="Nome do Proprietário" id="proprietario" required />
      <input type="number" placeholder="Número do Apartamento" id="apartamento" required />
      <input type="text" placeholder="Bloco do Apartamento" id="bloco" required />
      <input type="text" placeholder="Modelo do Veículo" id="modelo" required />

      <select id="cor" required>
        <option value="" disabled selected>Selecione a Cor</option>
        <option value="Branco">Branco</option>
        <option value="Preto">Preto</option>
        <option value="Cinza">Cinza</option>
        <option value="Prata">Prata</option>
        <option value="Vermelho">Vermelho</option>
        <option value="Azul">Azul</option>
        <option value="Verde">Verde</option>
        <option value="Amarelo">Amarelo</option>
      </select>

      <input type="number" placeholder="Número da Vaga" id="vaga" required />
      <button type="submit" class="btn">Salvar</button>
    </form>
  </div>

  <script>
    const TOTAL_VAGAS = 20; 
  
    const form = document.getElementById("formReserva");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
  
      const vagaEscolhida = parseInt(document.getElementById("vaga").value);
      const reservas = JSON.parse(localStorage.getItem("reservas") || "[]");
  
      if (vagaEscolhida > TOTAL_VAGAS || vagaEscolhida < 1) {
        alert(`Número de vaga inválido! O estacionamento possui vagas de 1 a ${TOTAL_VAGAS}.`);
        return;
      }

      const vagaOcupada = reservas.some(r => parseInt(r.vaga) === vagaEscolhida);
      if (vagaOcupada) {
        alert(`A vaga ${vagaEscolhida} já está ocupada! Escolha outra vaga.`);
        return;
      }

      const reserva = {
        placa: document.getElementById("placa").value,
        proprietario: document.getElementById("proprietario").value,
        apartamento: document.getElementById("apartamento").value,
        bloco: document.getElementById("bloco").value,
        modelo: document.getElementById("modelo").value,
        cor: document.getElementById("cor").value,
        vaga: vagaEscolhida
      };

      salvarReserva(reserva);
      alert("Reserva cadastrada com sucesso!");
      form.reset();
    });
  </script>
  <script src="js/controller.js"></script>
</body>
</html>
